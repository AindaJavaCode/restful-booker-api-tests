name: Performance Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tests
        uses: actions/checkout@v4

      - name: Check out restful-booker
        uses: actions/checkout@v4
        with:
          repository: mwinteringham/restful-booker
          path: restful-booker

      - name: Start restful-booker in Docker
        run: |
          docker build -t restful-booker ./restful-booker
          docker run -d -p 3001:3001 --name api restful-booker
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/ping && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run load test
        run: k6 run perf/booking-load.js
        env:
          BASE_URL: http://localhost:3001
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          K6_WEB_DASHBOARD: true
          K6_WEB_DASHBOARD_EXPORT: perf-report.html

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: perf-report.html